name: Build and publish Garmin report

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report dependencies
        run: python -m pip install psycopg2-binary
      - name: Install sync dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore Garmin token files
        env:
          GARMINTOKENS_MANGA_B64: ${{ secrets.GARMINTOKENS_MANGA_B64 }}
          GARMINTOKENS_CHIPS_B64: ${{ secrets.GARMINTOKENS_CHIPS_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.garminconnect" "$HOME/.garminconnect/chips"
          if [ -n "$GARMINTOKENS_MANGA_B64" ]; then
            printf '%s' "$GARMINTOKENS_MANGA_B64" | base64 --decode > "$HOME/.garminconnect/garmin_tokens.json"
            chmod 600 "$HOME/.garminconnect/garmin_tokens.json"
          fi
          if [ -n "$GARMINTOKENS_CHIPS_B64" ]; then
            printf '%s' "$GARMINTOKENS_CHIPS_B64" | base64 --decode > "$HOME/.garminconnect/chips/garmin_tokens.json"
            chmod 600 "$HOME/.garminconnect/chips/garmin_tokens.json"
          fi

      - name: Sync Garmin data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python sync_garmin_to_supabase.py
        
      - name: Build report from Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python build_report.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
